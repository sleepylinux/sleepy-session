[package]
name = "sleepy-session"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
dbus = "0.9.12"
fs2 = "0.4"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sd-notify = { version = "0.4.5", default-features = false }
sleepy-sdk = { git = "https://github.com/sleepylinux/sleepy-sdk", rev = "b3e3dd81ae2095fc5577aff5a02a4221b2323142" }
tokio = { version = "=1.43.0", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7.12", default-features = false }
uuid = { version = "1.24", features = ["v4"] }

[dev-dependencies]
tempfile = "3.27"
tokio = { version = "=1.43.0", features = ["test-util"] }
