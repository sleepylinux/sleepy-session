[package]
name = "sleepy-session"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"

[dependencies]
dbus = "0.9.12"
fs2 = "0.4"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sleepy-sdk = { git = "https://github.com/sleepylinux/sleepy-sdk", rev = "7abd3194055b4cbeef2a021b73ba7f4ce3923d02" }
tokio = { version = "=1.43.0", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
uuid = { version = "1.24", features = ["v4"] }

[dev-dependencies]
tempfile = "3.27"
