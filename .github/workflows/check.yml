name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evaluate:
    name: Evaluate x86_64 and aarch64
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out committed source
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@v31
      - name: Evaluate every supported system
        run: nix flake check --all-systems --no-build --show-trace
      - name: Assert tracked source is unchanged
        run: git diff --exit-code

  build:
    name: Build all x86_64 checks
    needs: evaluate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out committed source
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@v31
      - name: Build all component checks
        run: nix flake check -L
      - name: Assert tracked source is unchanged
        run: git diff --exit-code
