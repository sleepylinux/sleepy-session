name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evaluate:
    name: Evaluate x86_64 and aarch64
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out committed source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
      - name: Check Rust formatting
        run: nix develop --no-write-lock-file --command cargo fmt --check
      - name: Lint every Rust target
        run: nix develop --no-write-lock-file --command cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Test locked Rust graph
        run: nix develop --no-write-lock-file --command cargo test --locked --all-targets --all-features
      - name: Evaluate every supported system
        run: nix flake check --no-write-lock-file --all-systems --no-build --show-trace
      - name: Assert tracked source is unchanged
        run: git diff --exit-code

  build:
    name: Build all x86_64 checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out committed source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
      - name: Build all component checks
        run: nix flake check --no-write-lock-file -L
      - name: Assert tracked source is unchanged
        run: git diff --exit-code
